<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our flavours — the probe, as a buy surface</title>

<!--
  PROTOTYPE v3 — MOCKUP ONLY. Nothing here is wired into the app.
  v1 = flavour-probe-v1.html, v2 = flavour-probe.html.

  ===========================================================================
  WHY THIS EXISTS
  ===========================================================================
  v2 shipped as FlavourProbeOverlay.jsx. Screenshot reference/captures/7.png
  shows the problem: one pouch in the left third of a 1920 viewport, ~60% bare
  flood, three notes at 10.5px of which two are
  hardcoded identical for all three flavours. Price, heat, weight, rating and
  Add to cart were all on the card and all dissolved away, and the layer is
  pointer-events:none, so a deliberate hold is rewarded with strictly less
  than the user already had.

  New constraint from the owner: the whole site is to be optimised for the
  fastest, most convenient checkout. That reframes this screen entirely.

    A one-second deliberate hold on ONE flavour is the highest-intent signal
    anywhere on the homepage. It should therefore be the SHORTEST PATH TO A
    PAID ORDER on the entire site — not a dead-end poster.

  So the probe stops being an annotation and becomes a buy surface. Three
  directions below, switchable in Tweaks.

  ===========================================================================
  DESIGN READ
  ===========================================================================
    artifact          interactive prototype — one section's hover state, x3
    audience          the brand owner (look + conversion), the dev porting it
    visual-language   Indian snack packaging — flat keylines, bubble display
                      type, flood colour, ingredient doodles, torn radii
    mode              redesign · preserve (brand invariants held; only the
                      section's internals are overhauled)
    visual-variance   8      motion-intensity  6
    information-den.  6      (up from v2's 4 — the checkout brief needs it)
    asset-dependence  9      brand-fidelity    9

  Asset > Spec. Every identity-bearing element is the real thing: the pouch
  photography from /assets/products/*-plp.webp, Milkyway and ComicSansMS3,
  the packPalettes grounds/fills, the flat pack doodles, the traced CTA shape
  spliced in from src/styles/cta-shape.css, and all copy from products.js.
  Nothing identity-bearing is redrawn in CSS.

  ===========================================================================
  DESIGN SYSTEM  (all values lifted from the site — none invented here)
  ===========================================================================
    Colour     ink #071a16 · text #0d2818 · cream #fbf6d0 · foam #f5f0dc
               teal #4db8ae · sunshine #f3c63b · cta #facc15
               grounds   sweet #c8180d · jalapeño #0b5c2e · peri #5c0d16
               fills     sweet #f59120 · jalapeño #c3d92e · peri #c8102e
               accents   sweet #f8d43a · jalapeño #043f2d · peri #f4bd1a
    Type       Milkyway display / ComicSansMS3 body. Display runs 4–6x body,
               per the skill's contrast guidance.
    Spacing    4px base, 8pt rhythm above 16.
    Radius     torn — asymmetric clamp() pairs, never a machined corner.
    Shadow     hard offset only, no blur: 4px 5px 0 / 6px 7px 0 / 14px 16px 0.
    Motion     spring-ish cubic-bezier(.34,1.4,.64,1) for arrivals,
               cubic-bezier(.3,.8,.3,1) for the flood. All of it respects
               prefers-reduced-motion and the Tweaks toggle.

  ===========================================================================
  ⚠ DATA FLAG — surfaced in the mock, needs an owner decision
  ===========================================================================
  The offer ladder in src/data/products.js is inverted:

      1 pack   ₹170          (₹170 / pack)
      Trio  3  ₹499          (₹166 / pack)
      Six   6  ₹299          (₹50  / pack)   ← launch price, also in the ticker

  Six packs cost ₹200 LESS than three. Any customer who sees both buys the
  six, every time, and the trio is unsellable. A fast checkout makes this
  WORSE, not better: the faster the path, the faster people find the hole.
  The mock shows the real numbers so the problem is visible rather than
  designed around. FREE_SHIPPING_THRESHOLD is ₹499, which the six-pack at
  ₹299 does not reach — so the cheapest large order also pays shipping.

  ===========================================================================
  SERVE IT
  ===========================================================================
    npm run dev
    http://localhost:5173/prototypes/flavour-probe-checkout.html

  Needs the dev server so /assets/... resolves. Query params:
    ?dir=a|b|c     open on a direction      ?flavour=0|1|2   pick the pack
-->

:root{
  --ink:#071a16;  --text:#0d2818;  --cream:#fbf6d0;  --foam:#f5f0dc;
  --teal:#4db8ae; --sunshine:#f3c63b; --cta:#facc15;

  /* Repainted per flavour by JS from packPalettes + theme. */
  --ground:#c8180d; --fill:#f59120; --stem:#7a1408; --line:#5a0f08;
  --seed:#f7ead9;   --accent:#f8d43a;

  --torn-lg: clamp(16px,2.6vw,34px) clamp(11px,1.9vw,25px) clamp(17px,2.8vw,36px) clamp(10px,1.7vw,23px);
  --torn-sm: 15px 10px 17px 9px / 10px 16px 9px 15px;
  --ease-pop: cubic-bezier(.34,1.4,.64,1);
  --ease-flood: cubic-bezier(.3,.8,.3,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--cream); color:var(--text);
  font-family:'ComicSansMS3','Comic Sans MS',Nunito,system-ui,sans-serif;
  font-size:16px; line-height:1.5; overflow-x:clip;
}
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; cursor:pointer; }

/* One focus ring for the whole prototype, same rule the site uses. */
:where(a,button,[role='button'],input,summary,[tabindex]):focus-visible{
  outline:3px solid var(--teal); outline-offset:3px; border-radius:4px;
}
.pb-stage :where(button):focus-visible,
.pb-probe :where(button):focus-visible{ outline-color:var(--sunshine); }

.u-display{ font-family:'Milkyway','ComicSansMS3',system-ui,sans-serif; font-weight:400; line-height:.92; }
.u-caps{ text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:700; }
.u-sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ===========================================================================
   THE SECTION — a trimmed stand-in for FlavourGrid, so the gesture is real
   =========================================================================== */
.pb-section{
  position:relative; isolation:isolate; min-height:100vh;
  padding:28px 20px 40px; background:var(--cream);
  transition:background-color 560ms var(--ease-flood);
}
.pb-section[data-live]{ background:var(--ground); }

.pb-stage{ transition:filter 520ms ease, opacity 520ms ease; }
.pb-section[data-probe] .pb-stage{ filter:blur(26px) saturate(.5); opacity:0; pointer-events:none; }

.pb-masthead{ text-align:center; margin:0 0 10px; }
.pb-masthead h1{
  margin:0; font-size:clamp(2.6rem,6vw,4rem); color:var(--sunshine);
  -webkit-text-stroke:.075em var(--ink); paint-order:stroke fill;
  text-shadow:.055em .07em 0 var(--ink);
}
.pb-sub{ min-height:34px; text-align:center; margin:0 0 20px; color:var(--foam); font-size:14px; }
.pb-sub b{ font-family:'Milkyway',sans-serif; font-weight:400; font-size:24px; color:var(--fill); }

.pb-panel{
  max-width:1120px; margin:0 auto; padding:18px;
  border:4px solid var(--ink); border-radius:36px; background:var(--teal);
  box-shadow:6px 7px 0 var(--ink);
  transition:background-color 560ms var(--ease-flood);
}
.pb-section[data-live] .pb-panel{ background:var(--ground); }
.pb-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }

.pb-card{
  display:flex; flex-direction:column; padding:0 0 14px;
  border:3px solid var(--ink); border-radius:26px; background:var(--cream);
  box-shadow:4px 5px 0 var(--ink); overflow:hidden; text-align:center;
}
.pb-tile{
  position:relative; display:block; width:100%; aspect-ratio:5/4;
  margin:0 0 10px; padding:0; border:0; border-bottom:3px solid var(--ink);
  background:#f7f1c8;
}
.pb-tile img{ width:100%; height:100%; object-fit:contain; }
.pb-card h2{ margin:0 0 2px; font-size:19px; font-family:'Milkyway',sans-serif; font-weight:400; }
.pb-card p{ margin:0; font-size:12px; opacity:.72; }
.pb-card .pb-price{ margin-top:8px; font-family:'Milkyway',sans-serif; font-size:22px; }

/* THE FUSE — the hold, made visible. Burns along the tile's bottom edge in
   the flavour's own ink and completes exactly as the probe opens, so an
   accidental brush reads differently from a deliberate hold. */
.pb-fuse{
  position:absolute; left:0; bottom:0; height:7px; width:0;
  background:var(--fill); border-radius:0 4px 4px 0; pointer-events:none;
}
.pb-tile[data-holding] .pb-fuse{
  width:100%; transition:width var(--dwell,1000ms) linear;
}

/* ===========================================================================
   THE PROBE — one layer, three directions
   =========================================================================== */
.pb-probe{
  position:absolute; inset:0; z-index:20; display:none;
  padding:clamp(20px,4vw,64px); color:var(--foam);
}
.pb-section[data-probe] .pb-probe{ display:grid; }

.pb-probe[data-dir='a']{ place-items:center; }
.pb-probe[data-dir='b'],
.pb-probe[data-dir='c']{ align-content:center; grid-template-columns:minmax(0,46fr) minmax(0,54fr); gap:clamp(20px,3.4vw,56px); }

.pb-close{
  position:absolute; top:18px; right:20px; z-index:9; width:40px; height:40px;
  display:grid; place-items:center; padding:0;
  border:3px solid var(--ink); border-radius:var(--torn-sm);
  background:var(--cream); box-shadow:3px 4px 0 var(--ink);
  font-family:'Milkyway',sans-serif; font-size:18px; line-height:1; color:var(--ink);
}
.pb-close:hover{ transform:scale(1.06); }

/* --- the pouch, lifted ---------------------------------------------------- */
.pb-pack{ position:relative; justify-self:center; width:100%; max-width:min(38vw,440px); }
.pb-probe[data-dir='a'] .pb-pack{ max-width:min(30vw,360px); }
.pb-packframe{
  position:relative; aspect-ratio:1; background:#f7f1c8;
  border:2px solid var(--line); border-radius:var(--torn-lg);
  box-shadow:14px 16px 0 rgba(7,26,22,.55);
  animation:pb-rise 480ms var(--ease-pop) both;
}
.pb-packframe img{ width:100%; height:100%; object-fit:contain; border-radius:inherit; }
@keyframes pb-rise{ from{ transform:translateY(16px) scale(.94); opacity:.2; } to{ transform:none; opacity:1; } }

/* hand-drawn arrows, double-passed the way a pen goes over a line twice */
.pb-marks{ position:absolute; top:50%; left:50%; translate:-50% -50%; height:100%; aspect-ratio:1; overflow:visible; pointer-events:none; }
.pb-marks path{
  fill:none; stroke:var(--cream); stroke-width:.9; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:var(--len) var(--len); stroke-dashoffset:var(--len);
  filter:drop-shadow(0 0 1.6px rgba(7,26,22,.75));
}
.pb-marks path.ghost{ opacity:.45; stroke-width:.62; }
.pb-marks.lit path{ stroke-dashoffset:0; transition:stroke-dashoffset 620ms cubic-bezier(.4,.75,.3,1); transition-delay:calc(var(--i,0)*110ms); }
.pb-marks.lit path.ghost{ transition-delay:calc(var(--i,0)*110ms + 70ms); }

/* --- pinned notes --------------------------------------------------------- */
.pb-note{
  position:absolute; z-index:5; width:9.6rem; padding:9px 11px 10px;
  border:3px solid var(--ink); border-radius:var(--torn-sm);
  background:var(--cream); box-shadow:4px 5px 0 var(--ink);
  color:var(--ink); font-size:13px; line-height:1.34; text-align:left; text-wrap:pretty;
  animation:pb-tag 420ms var(--ease-pop) both; animation-delay:calc(200ms + var(--i,0)*120ms);
}
.pb-note b{
  display:block; width:fit-content; margin-bottom:5px; padding-bottom:1px;
  border-bottom:3px solid var(--fill);
  font-family:'Milkyway',sans-serif; font-weight:400; font-size:16px; letter-spacing:.015em;
}
.pb-note.n-a{ left:-17%; top:2%;    --turn:-2.8deg; }
.pb-note.n-b{ right:-15%; top:36%;  --turn:2.2deg; }
.pb-note.n-c{ left:-12%; bottom:3%; --turn:-1.6deg; }
@keyframes pb-tag{ from{ opacity:0; transform:translate(5px,12px) scale(.88); } to{ opacity:1; transform:rotate(var(--turn,0deg)); } }

/* --- the heat rail, in the pack's own chilli ------------------------------ */
.pb-heat{ display:flex; align-items:center; gap:10px; }
.pb-heat-pips{ display:flex; align-items:flex-end; gap:5px; }
.pb-heat-pips img{ width:20px; height:auto; flex:0 0 auto; }
.pb-heat-pips img[data-off]{ opacity:.3; }
.pb-heat span{ color:var(--foam); opacity:.8; }

/* ===========================================================================
   THE BUY BLOCK — the point of the redesign
   =========================================================================== */
.pb-eyebrow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; color:var(--foam); }
.pb-badge{
  padding:4px 11px 5px; border:2.5px solid var(--ink); border-radius:999px;
  background:var(--accent); color:var(--ink); box-shadow:2px 3px 0 var(--ink);
}
.pb-rating{ opacity:.85; }

.pb-headline{
  margin:0 0 14px; color:var(--accent);
  font-size:clamp(2.4rem,4.6vw,4.2rem);
  -webkit-text-stroke:.055em var(--ink); paint-order:stroke fill;
  text-shadow:.045em .06em 0 var(--ink);
}
.pb-blurb{ margin:0 0 20px; max-width:34ch; font-size:clamp(15px,1.15vw,17px); line-height:1.5; color:var(--foam); opacity:.92; text-wrap:pretty; }

/* ingredients as the pack's own doodles, not a comma list */
.pb-ings{ display:flex; gap:9px; flex-wrap:wrap; margin:0 0 22px; padding:0; list-style:none; }
.pb-ings li{
  display:flex; align-items:center; gap:7px; padding:5px 12px 6px 8px;
  border:2.5px solid var(--ink); border-radius:999px;
  background:var(--cream); color:var(--ink); box-shadow:2px 3px 0 var(--ink);
  font-size:12.5px;
}
.pb-ings img{ width:17px; }

/* --- quantity as chips, not a stepper ------------------------------------- */
/* A stepper costs N clicks for N packs. Chips cost one, and they let the
   per-pack economics be stated at the moment of choosing. */
.pb-qty{ display:flex; gap:9px; margin:0 0 16px; }
.pb-chip{
  position:relative; min-width:76px; padding:9px 12px 10px;
  border:3px solid var(--ink); border-radius:var(--torn-sm);
  background:var(--cream); color:var(--ink); box-shadow:3px 4px 0 var(--ink);
  text-align:center; line-height:1.15;
  transition:transform .16s var(--ease-pop), background-color .16s ease;
}
.pb-chip:hover{ transform:translateY(-2px); }
.pb-chip[aria-pressed='true']{ background:var(--accent); transform:translateY(-3px); box-shadow:4px 6px 0 var(--ink); }
.pb-chip b{ display:block; font-family:'Milkyway',sans-serif; font-weight:400; font-size:19px; }
.pb-chip i{ display:block; font-style:normal; font-size:10.5px; opacity:.7; }

/* --- free shipping, drawn as the brand's own rail -------------------------- */
/* ₹499 unlocks free shipping and nothing on the site says so until checkout.
   This is the strongest AOV lever available and it costs one row. */
.pb-ship{ margin:0 0 18px; }
.pb-ship-track{
  position:relative; height:13px; border:2.5px solid var(--ink); border-radius:999px;
  background:rgba(251,246,208,.22); overflow:hidden;
}
.pb-ship-fill{ height:100%; width:0; background:var(--accent); transition:width 420ms var(--ease-flood); }
.pb-ship-label{ margin-top:7px; font-size:12.5px; color:var(--foam); opacity:.9; }
.pb-ship-label b{ color:var(--accent); font-weight:400; font-family:'Milkyway',sans-serif; font-size:15px; }

/* --- the primary action ---------------------------------------------------- */
.pb-actions{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.pb-buy{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:3.5rem; padding:.85rem 2.6rem; border:0; background:transparent;
  background-image:var(--jni-cta-shape); background-repeat:no-repeat; background-size:100% 100%;
  color:var(--text); font-family:'Milkyway',sans-serif; font-size:1.35rem; line-height:1.1;
  transition:transform .18s var(--ease-pop), filter .16s ease;
}
.pb-buy:hover{ transform:scale(1.05); filter:brightness(1.06); }
.pb-buy:active{ transform:scale(.96); }
.pb-buy small{ font-family:'ComicSansMS3',sans-serif; font-size:.72rem; opacity:.7; }

.pb-ghost{
  padding:.7rem 1.3rem; border:2.5px dashed rgba(251,246,208,.55); border-radius:999px;
  background:transparent; color:var(--foam); font-size:14px;
  transition:border-color .16s ease, background-color .16s ease;
}
.pb-ghost:hover{ border-color:var(--foam); background:rgba(251,246,208,.1); }

.pb-trust{ margin:16px 0 0; font-size:11.5px; color:var(--foam); opacity:.62; letter-spacing:.06em; }

/* --- the honest upsell ----------------------------------------------------- */
.pb-upsell{
  display:flex; align-items:center; gap:14px; width:100%; margin-top:20px; padding:11px 16px 12px;
  border:2.5px dashed var(--accent); border-radius:var(--torn-sm);
  background:transparent; color:var(--foam); font-size:13px; text-align:left;
  transition:background-color .16s ease;
}
.pb-upsell:hover{ background:rgba(251,246,208,.1); }
.pb-ticket .pb-upsell:hover{ background:rgba(7,26,22,.06); }
.pb-upsell img{ width:52px; flex:0 0 auto; border-radius:8px; }
.pb-upsell span{ flex:1 1 auto; line-height:1.45; }
.pb-upsell b{ font-family:'Milkyway',sans-serif; font-weight:400; font-size:17px; color:var(--accent); }
.pb-ticket .pb-upsell b{ color:var(--line); }
.pb-upsell u{ text-decoration-color:currentColor; text-underline-offset:3px; }

/* --- DIRECTION A: the buy rail, compact ------------------------------------ */
.pb-rail{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center;
  margin-top:26px; padding:16px 22px 18px;
  border:3px solid var(--ink); border-radius:var(--torn-lg);
  background:rgba(7,26,22,.3); backdrop-filter:blur(2px);
}
.pb-rail .pb-qty,
.pb-rail .pb-ship{ margin:0; }
.pb-rail .pb-ship{ min-width:210px; }

/* --- DIRECTION C: the counter ticket --------------------------------------- */
/* The brand's cream note idiom, scaled up to a snack-counter docket. The
   perforation and the torn stub are the signature: this is the one place the
   design spends its boldness. */
.pb-ticket{
  position:relative; align-self:center; padding:26px 28px 24px;
  border:3px solid var(--ink); border-radius:var(--torn-lg);
  background:var(--cream); color:var(--ink); box-shadow:10px 12px 0 rgba(7,26,22,.55);
  animation:pb-tag 460ms var(--ease-pop) both; animation-delay:120ms;
}
.pb-ticket::before,
.pb-ticket::after{
  content:''; position:absolute; top:-11px; width:22px; height:22px;
  border:3px solid var(--ink); border-radius:50%; background:var(--ground);
}
.pb-ticket::before{ left:-11px; } .pb-ticket::after{ right:-11px; }

.pb-ticket .pb-eyebrow,
.pb-ticket .pb-blurb,
.pb-ticket .pb-ship-label,
.pb-ticket .pb-trust,
.pb-ticket .pb-upsell{ color:var(--ink); }
.pb-ticket .pb-headline{ font-size:clamp(2rem,3.4vw,3rem); margin-bottom:10px; }
.pb-ticket .pb-ghost{ border-color:rgba(7,26,22,.4); color:var(--ink); }
.pb-ticket .pb-ghost:hover{ border-color:var(--ink); background:rgba(7,26,22,.07); }
.pb-ticket .pb-ship-track{ background:rgba(7,26,22,.12); }
.pb-ticket .pb-heat span{ color:var(--ink); opacity:.75; }
.pb-ticket .pb-ship-label b{ color:var(--line); }

.pb-rule{ height:0; margin:18px 0; border-top:3px dashed rgba(7,26,22,.3); }

.pb-lines{ margin:0 0 4px; padding:0; list-style:none; font-size:14px; }
.pb-lines li{ display:flex; justify-content:space-between; gap:16px; padding:5px 0; }
.pb-lines li span:last-child{ font-variant-numeric:tabular-nums; }
.pb-lines .muted{ opacity:.6; }

.pb-total{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin:14px 0 20px; }
.pb-total dt{ font-size:13px; opacity:.7; }
.pb-total dd{ margin:0; font-family:'Milkyway',sans-serif; font-size:clamp(2.2rem,3.6vw,3rem); line-height:1; }
.pb-total dd s{ margin-left:10px; font-size:1rem; opacity:.45; font-family:'ComicSansMS3',sans-serif; }

/* ===========================================================================
   THE PAY SHEET — proof of the "fastest checkout" claim
   =========================================================================== */
.pb-pay{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:none;
  padding:22px clamp(18px,4vw,40px) 26px;
  border-top:4px solid var(--ink); border-radius:34px 28px 0 0 / 26px 32px 0 0;
  background:var(--cream); color:var(--ink); box-shadow:0 -12px 0 rgba(7,26,22,.25);
}
.pb-pay[data-open]{ display:block; animation:pb-sheet 320ms cubic-bezier(.22,1,.36,1) both; }
@keyframes pb-sheet{ from{ transform:translateY(100%); } to{ transform:none; } }
.pb-pay-in{ max-width:620px; margin:0 auto; }
.pb-pay h3{ margin:0 0 4px; font-family:'Milkyway',sans-serif; font-weight:400; font-size:26px; }
.pb-pay p{ margin:0 0 16px; font-size:13.5px; opacity:.72; }
.pb-pay-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 16px; margin-bottom:10px; border:3px solid var(--ink); border-radius:var(--torn-sm); background:#fff; box-shadow:3px 4px 0 var(--ink); }
.pb-pay-row b{ font-family:'Milkyway',sans-serif; font-weight:400; font-size:19px; }
.pb-pay .pb-buy{ width:100%; }
.pb-pay-note{ margin:14px 0 0; font-size:11.5px; opacity:.55; text-align:center; }

/* ===========================================================================
   TWEAKS
   =========================================================================== */
.pb-tweaks{
  position:fixed; right:18px; bottom:18px; z-index:70; width:270px;
  padding:16px 18px 18px; border:3px solid var(--ink); border-radius:22px;
  background:var(--cream); color:var(--ink); box-shadow:5px 6px 0 var(--ink);
  font-size:13px;
}
.pb-tweaks[hidden]{ display:none; }
.pb-tweaks h4{ margin:0 0 12px; font-family:'Milkyway',sans-serif; font-weight:400; font-size:20px; }
.pb-tweaks label{ display:block; margin:0 0 5px; font-size:11px; text-transform:uppercase; letter-spacing:.1em; opacity:.6; }
.pb-tweaks .grp{ margin-bottom:14px; }
.pb-tweaks .segs{ display:flex; gap:6px; }
.pb-tweaks .segs button{
  flex:1; padding:7px 4px; border:2.5px solid var(--ink); border-radius:10px;
  background:#fff; font-size:12px;
}
.pb-tweaks .segs button[aria-pressed='true']{ background:var(--sunshine); }
.pb-tweaks input[type='range']{ width:100%; accent-color:var(--teal); }
.pb-tweaks .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.pb-toggle{ position:fixed; right:18px; bottom:18px; z-index:69; padding:10px 16px; border:3px solid var(--ink); border-radius:999px; background:var(--sunshine); box-shadow:4px 5px 0 var(--ink); font-family:'Milkyway',sans-serif; font-size:15px; }

.pb-hint{
  position:fixed; left:50%; bottom:20px; translate:-50% 0; z-index:55;
  padding:9px 18px 10px; border:3px solid var(--ink); border-radius:999px;
  background:var(--cream); color:var(--ink); box-shadow:4px 5px 0 var(--ink);
  font-size:13px; pointer-events:none;
  transition:opacity .3s ease;
}
.pb-section[data-probe] ~ .pb-hint{ opacity:0; }

/* ===========================================================================
   RESPONSIVE — the probe works stacked on phones too, which v2 gave up on
   =========================================================================== */
@media (max-width:1040px){
  .pb-note{ display:none; }              /* no room either side of the pack */
  .pb-probe[data-dir='b'],
  .pb-probe[data-dir='c']{ grid-template-columns:1fr; gap:22px; }
  .pb-pack{ max-width:min(52vw,330px); }
  .pb-probe[data-dir='a'] .pb-pack{ max-width:min(52vw,300px); }
}
@media (max-width:720px){
  .pb-cards{ grid-template-columns:1fr; }
  .pb-probe{ padding:16px; overflow-y:auto; }
  .pb-probe[data-dir='a'],
  .pb-probe[data-dir='b'],
  .pb-probe[data-dir='c']{ align-content:start; align-items:start; }
  .pb-probe[data-dir='a']{ place-items:start center; }
  .pb-pack{ max-width:min(64vw,260px); }
  .pb-headline{ font-size:clamp(1.7rem,7.4vw,2.3rem); }
  .pb-pack{ justify-self:start; }
  .pb-qty{ flex-wrap:wrap; }
  .pb-buy{ width:100%; }
  .pb-tweaks{ left:18px; right:18px; width:auto; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
body[data-nomotion] *,
body[data-nomotion] *::before,
body[data-nomotion] *::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
</style>
</head>

<body>

<section class="pb-section" id="section">
  <!-- The page as it sits at rest. Hold a pack to open the probe. -->
  <div class="pb-stage" id="stage">
    <div class="pb-masthead"><h1 class="u-display">Our flavours</h1></div>
    <p class="pb-sub" id="sub"></p>
    <div class="pb-panel">
      <div class="pb-cards" id="cards"></div>
    </div>
  </div>

  <!-- The probe layer. Outside the stage, because the stage is what dissolves. -->
  <div class="pb-probe" id="probe" data-dir="b"></div>
</section>

<p class="pb-hint" id="hint">Hold a pack for a second — or tap it on touch</p>

<!-- Proof of the brief: Buy now lands here, not in a cart drawer. -->
<div class="pb-pay" id="pay" role="dialog" aria-modal="true" aria-labelledby="pay-h"></div>

<button class="pb-toggle" id="tweaks-open">Tweaks</button>
<aside class="pb-tweaks" id="tweaks" hidden>
  <h4>Tweaks</h4>
  <div class="grp">
    <label for="seg-dir">Direction</label>
    <div class="segs" id="seg-dir">
      <button type="button" data-dir="a" aria-pressed="false">A · Dissect</button>
      <button type="button" data-dir="b" aria-pressed="true">B · Dossier</button>
      <button type="button" data-dir="c" aria-pressed="false">C · Ticket</button>
    </div>
  </div>
  <div class="grp">
    <label for="seg-flav">Flavour</label>
    <div class="segs" id="seg-flav">
      <button type="button" data-flavour="0" aria-pressed="true">Sweet</button>
      <button type="button" data-flavour="1" aria-pressed="false">Jalapeño</button>
      <button type="button" data-flavour="2" aria-pressed="false">Peri</button>
    </div>
  </div>
  <div class="grp">
    <label for="dwell">Hold to open · <span id="dwell-val">1000</span>ms</label>
    <input type="range" id="dwell" min="300" max="2500" step="100" value="1000">
  </div>
  <div class="grp row">
    <label for="fuse" style="margin:0">Show the fuse</label>
    <input type="checkbox" id="fuse" checked>
  </div>
  <div class="grp row">
    <label for="nomotion" style="margin:0">Reduce motion</label>
    <input type="checkbox" id="nomotion">
  </div>
  <div class="row"><button type="button" id="tweaks-close" class="pb-ghost" style="border-color:rgba(7,26,22,.4);color:var(--ink);padding:.4rem 1rem">Close</button></div>
</aside>

<script>
/* ===========================================================================
   DATA — transcribed from src/data/products.js. Nothing invented.
   =========================================================================== */
const SHIP_FREE = 499;   // FREE_SHIPPING_THRESHOLD
const SHIP_COST = 49;    // indicative; the real figure lives at checkout

const PRODUCTS = [
  {
    slug:'sweet-chilli-rush', shortName:'Sweet Chilli Rush', flavor:'Sweet Heat', heat:1,
    tagline:'Sweet, Spicy, Irresistible.',
    flavourHeading:'Sweet. Full of Character.',
    flavourDescription:'A glossy sweet-chilli crunch balanced with real heat, delivering craveable sweetness first, fire right after.',
    price:170, originalPrice:190, weight:'100 gms', badge:'Crowd pleaser',
    rating:{value:4.7,count:98},
    ingredients:['Sweet chilli seasoning','Red chilli','Crisp fried base'],
    palette:{ground:'#c8180d',fill:'#f59120',stem:'#7a1408',line:'#5a0f08',seed:'#f7ead9'},
    accent:'#f8d43a',
    img:'/assets/products/sweet-chilli-rush-plp.webp',
  },
  {
    slug:'jalapeno-kick', shortName:'Jalapeño Kick', flavor:'Fresh Heat', heat:2,
    tagline:'A spicy little kick.',
    flavourHeading:'Fresh. Full of Character.',
    flavourDescription:'A crisp jalapeño-led bite with fresh pepper character, delivering clean heat that keeps the hand going back.',
    price:170, originalPrice:190, weight:'100 gms', badge:'Fresh drop',
    rating:{value:4.6,count:143},
    ingredients:['Jalapeño seasoning','Green pepper','Crisp fried base'],
    palette:{ground:'#0b5c2e',fill:'#c3d92e',stem:'#0e4a26',line:'#0d3f22',seed:'#dfe7bd'},
    accent:'#f3c63b',
    img:'/assets/products/jalapeno-kick-plp.webp',
  },
  {
    slug:'peri-peri-punch', shortName:'Peri Peri Punch', flavor:'Big Heat', heat:3,
    tagline:'Fire with every crunch.',
    flavourHeading:'Spicy. Full of Character.',
    flavourDescription:'A lively kick balanced with savoury depth, delivering flavour first, heat second.',
    price:170, originalPrice:190, weight:'100 gms', badge:'Heat hero',
    rating:{value:4.8,count:125},
    ingredients:['Peri peri seasoning','Red chilli','Crisp fried base'],
    palette:{ground:'#5c0d16',fill:'#c8102e',stem:'#4a0a11',line:'#3d060c',seed:'#e8c7c1'},
    accent:'#f4bd1a',
    img:'/assets/products/peri-peri-punch-plp.webp',
  },
];

/* The six-pack, shown as the upsell. See the DATA FLAG in the header comment:
   at ₹299 for six it undercuts the ₹499 trio and every multi-pack ladder we
   could build out of singles. Shown at its real price so the hole is visible. */
const SIX = { name:"FLIPO's Party Six", price:299, originalPrice:949, packs:6,
              img:'/assets/pick/flipos-party-six-1.webp', slug:'flipos-party-six' };

/* Which doodle stands in for which ingredient — the pack's own artwork, flat
   SVGs already generated per flavour by tools/build-doodles.py. */
const ING_SHAPE = ['chilli-whole','pepper-section','seed'];

/* Arrow geometry, ported unchanged from FlavourProbeOverlay.jsx. */
const ARROWS = [
  { d:'M21,13 C32,14 39,19 46,26', head:[46,26,39.5,22.5,40,29.5] },
  { d:'M79,42 C72,44 66,46 60,49', head:[60,49,65.5,46,66,52] },
  { d:'M26,84 C31,79 35,73 40,66', head:[40,66,34.5,66.5,38.5,71] },
];

/* ===========================================================================
   STATE
   =========================================================================== */
const params = new URLSearchParams(location.search);
const state = {
  dir: params.get('dir') || 'b',
  index: Number(params.get('flavour') ?? 0),
  live: null,        // flooded flavour index
  probe: null,       // opened flavour index
  qty: 1,
  dwell: 1000,
  fuse: true,
};

const $ = (s) => document.querySelector(s);
const section = $('#section'), probeEl = $('#probe'), payEl = $('#pay');
const rupee = (n) => '₹' + n.toLocaleString('en-IN');

/* ===========================================================================
   PAINT — one place sets the flavour custom properties
   =========================================================================== */
function paint(p){
  const r = document.documentElement.style;
  r.setProperty('--ground', p.palette.ground);
  r.setProperty('--fill',   p.palette.fill);
  r.setProperty('--stem',   p.palette.stem);
  r.setProperty('--line',   p.palette.line);
  r.setProperty('--seed',   p.palette.seed);
  r.setProperty('--accent', p.accent);
}

function doodle(slug, shape){ return `/assets/doodles/pack/${slug}-${shape}.svg`; }

function heatRail(p){
  const pips = [0,1,2].map(i =>
    `<img src="${doodle(p.slug,'chilli-whole')}" alt="" ${i < p.heat ? '' : 'data-off'}>`
  ).join('');
  return `<div class="pb-heat"><div class="pb-heat-pips" role="img" aria-label="Heat level ${p.heat} of 3: ${p.flavor}">${pips}</div><span class="u-caps">${p.flavor}</span></div>`;
}

/* ===========================================================================
   THE CARDS
   =========================================================================== */
function buildCards(){
  $('#cards').innerHTML = PRODUCTS.map((p,i) => `
    <article class="pb-card">
      <button class="pb-tile" data-i="${i}" aria-label="Read the ${p.shortName} pack">
        <img src="${p.img}" alt="">
        <span class="pb-fuse" aria-hidden="true"></span>
      </button>
      <h2>${p.shortName}</h2>
      <p>${p.tagline}</p>
      <div class="pb-price">${rupee(p.price)} <s style="font-size:14px;opacity:.5">${rupee(p.originalPrice)}</s></div>
    </article>
  `).join('');

  $('#cards').querySelectorAll('.pb-tile').forEach(tile => {
    const i = Number(tile.dataset.i);
    let timer = null;
    const start = () => {
      flood(i);
      if (state.fuse) tile.dataset.holding = '';
      tile.style.setProperty('--dwell', state.dwell + 'ms');
      timer = setTimeout(() => open(i), state.dwell);
    };
    const stop = () => { clearTimeout(timer); delete tile.dataset.holding; if (state.probe == null) flood(null); };
    tile.addEventListener('pointerenter', start);
    tile.addEventListener('pointerleave', stop);
    tile.addEventListener('focus', start);
    tile.addEventListener('blur', stop);
    // Touch has no hover, so a tap opens it outright. v2 gave phones nothing.
    tile.addEventListener('click', (e) => { e.preventDefault(); clearTimeout(timer); open(i); });
  });
}

function flood(i){
  state.live = i;
  if (i == null){ delete section.dataset.live; $('#sub').innerHTML = ''; return; }
  const p = PRODUCTS[i];
  paint(p);
  section.dataset.live = p.slug;
  $('#sub').innerHTML = `<b>${p.shortName}.</b> ${p.tagline}`;
}

/* ===========================================================================
   THE PROBE
   =========================================================================== */
function open(i){
  state.probe = i; state.qty = 1;
  const p = PRODUCTS[i];
  paint(p);
  section.dataset.live = p.slug;
  section.dataset.probe = p.slug;
  probeEl.dataset.dir = state.dir;
  probeEl.innerHTML = render(p);
  wireProbe(p);
  drawArrows();
  probeEl.querySelector('.pb-close')?.focus({ preventScroll:true });
}

function close(){
  state.probe = null;
  delete section.dataset.probe; delete section.dataset.live;
  probeEl.innerHTML = ''; $('#sub').innerHTML = '';
  delete payEl.dataset.open;
}

function packBlock(p, notes){
  return `
    <div class="pb-pack">
      <div class="pb-packframe">
        <img src="${p.img}" alt="${p.shortName} pack">
        <svg class="pb-marks" viewBox="0 0 100 100" aria-hidden="true"></svg>
        ${notes.map((n,i) => `
          <span class="pb-note n-${n.k}" style="--i:${i}">
            <b>${n.t}</b>${n.b}
          </span>`).join('')}
      </div>
    </div>`;
}

/* The two notes that are genuinely about the OBJECT stay on the photo.
   Everything about taste moved into the panel, where it can be read. */
const OBJECT_NOTES = [
  { k:'a', t:'Reseal it', b:'Zip-lock stand-up pouch — stash the rest for later.' },
  { k:'b', t:'Fried crisp', b:'Fried for the snap — the crunch is the whole point.' },
];

function buyBlock(p, opts = {}){
  const tiers = [1,2,3];
  return `
    <div class="pb-qty" role="group" aria-label="How many packs">
      ${tiers.map(n => `
        <button type="button" class="pb-chip" data-qty="${n}" aria-pressed="${n===state.qty}">
          <b>${n} pack${n>1?'s':''}</b>
          <i>${rupee(p.price*n)}</i>
        </button>`).join('')}
    </div>

    <div class="pb-ship">
      <div class="pb-ship-track"><div class="pb-ship-fill" id="ship-fill"></div></div>
      <p class="pb-ship-label" id="ship-label"></p>
    </div>

    <div class="pb-actions">
      <button type="button" class="pb-buy" id="buy">
        Buy now · <span id="buy-total">${rupee(p.price)}</span>
      </button>
      <button type="button" class="pb-ghost" id="atc">Add to cart instead</button>
    </div>

    <p class="pb-trust u-caps">UPI · Cards · COD · Dispatched in 24h</p>

    ${opts.upsell === false ? '' : `
      <button type="button" class="pb-upsell" id="upsell">
        <img src="${SIX.img}" alt="">
        <span>
          <b>Or six packs for ${rupee(SIX.price)}.</b>
          <span style="display:block">Two of every flavour, <s>${rupee(SIX.originalPrice)}</s> — <u>swap this order</u></span>
        </span>
      </button>`}
  `;
}

function storyBlock(p){
  return `
    <div class="pb-eyebrow">
      <span class="pb-badge u-caps">${p.badge}</span>
      ${heatRail(p)}
      <span class="pb-rating">★ ${p.rating.value} <span style="opacity:.6">(${p.rating.count})</span></span>
    </div>
    <h2 class="pb-headline u-display">${p.flavourHeading}</h2>
    <p class="pb-blurb">${p.flavourDescription}</p>
    <ul class="pb-ings">
      ${p.ingredients.map((ing,i) => `<li><img src="${doodle(p.slug, ING_SHAPE[i] || 'seed')}" alt="">${ing}</li>`).join('')}
    </ul>`;
}

function render(p){
  const dismiss = `<button type="button" class="pb-close" id="close" aria-label="Close">✕</button>`;

  /* A — DISSECT. The v2 idea, fixed: pack at true centre, notes ringed, and a
     compact buy rail beneath so the hold still ends somewhere. */
  if (state.dir === 'a') return `
    ${dismiss}
    <div style="display:grid;justify-items:center;max-width:860px;width:100%">
      ${packBlock(p, [...OBJECT_NOTES, { k:'c', t:"What's in it", b:p.ingredients.join(', ') + '.' }])}
      <div style="margin-top:22px;text-align:center">
        <h2 class="pb-headline u-display" style="font-size:clamp(1.8rem,3vw,2.6rem);margin-bottom:8px">${p.shortName}</h2>
        <div style="display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap">
          ${heatRail(p)}
          <span class="pb-rating" style="color:var(--foam)">★ ${p.rating.value} (${p.rating.count})</span>
          <span style="color:var(--foam);opacity:.7;font-size:13px">${p.weight}</span>
        </div>
      </div>
      <div class="pb-rail">${buyBlock(p, { upsell:false })}</div>
    </div>`;

  /* B — DOSSIER. Pack left, the flavour's own story and the full buy block
     right. The void becomes the half of the spread that sells. */
  if (state.dir === 'b') return `
    ${dismiss}
    ${packBlock(p, OBJECT_NOTES)}
    <div style="max-width:min(34rem,100%);min-width:0">
      ${storyBlock(p)}
      ${buyBlock(p)}
    </div>`;

  /* C — TICKET. The counter docket: the cream note idiom scaled to a receipt,
     perforated, with the order already written out. Boldest of the three. */
  return `
    ${dismiss}
    ${packBlock(p, OBJECT_NOTES)}
    <div class="pb-ticket">
      <div class="pb-eyebrow">
        <span class="pb-badge u-caps">${p.badge}</span>
        ${heatRail(p)}
        <span class="pb-rating">★ ${p.rating.value} (${p.rating.count})</span>
      </div>
      <h2 class="pb-headline u-display">${p.shortName}</h2>
      <p class="pb-blurb" style="margin-bottom:14px">${p.flavourDescription}</p>
      <div class="pb-rule"></div>
      <ul class="pb-lines" id="lines"></ul>
      <dl class="pb-total">
        <dt>Total, delivered</dt>
        <dd id="ticket-total"></dd>
      </dl>
      ${buyBlock(p)}
    </div>`;
}

/* --- the pen-drawn arrows, two passes each -------------------------------- */
function drawArrows(){
  const svg = probeEl.querySelector('.pb-marks');
  if (!svg) return;
  const ns = 'http://www.w3.org/2000/svg';
  const jitter = (d,k) => d.replace(/\d+(?:\.\d+)?/g, n =>
    (Number(n) + Math.sin(Number(n)*12.9898 + k) * 0.75).toFixed(2));

  ARROWS.forEach((a,i) => {
    const [hx,hy,ax,ay,bx,by] = a.head;
    const headD = `M${ax},${ay} L${hx},${hy} L${bx},${by}`;
    [[a.d,false],[headD,false],[jitter(a.d,i+1),true],[jitter(headD,i+5),true]].forEach(([d,ghost]) => {
      const path = document.createElementNS(ns,'path');
      path.setAttribute('d', d);
      if (ghost) path.setAttribute('class','ghost');
      path.style.setProperty('--i', String(i));
      svg.appendChild(path);
      path.style.setProperty('--len', path.getTotalLength().toFixed(1));
    });
  });
  requestAnimationFrame(() => svg.classList.add('lit'));
}

/* ===========================================================================
   THE BUY LOGIC — the thing the brief is actually about
   =========================================================================== */
function subtotal(p){ return p.price * state.qty; }
function shipping(p){ return subtotal(p) >= SHIP_FREE ? 0 : SHIP_COST; }
function total(p){ return subtotal(p) + shipping(p); }

function syncBuy(p){
  const sub = subtotal(p), ship = shipping(p);
  const pct = Math.min(100, Math.round(sub / SHIP_FREE * 100));

  probeEl.querySelectorAll('.pb-chip').forEach(c =>
    c.setAttribute('aria-pressed', String(Number(c.dataset.qty) === state.qty)));

  const fill = probeEl.querySelector('#ship-fill');
  if (fill) fill.style.width = pct + '%';

  const label = probeEl.querySelector('#ship-label');
  if (label){
    label.innerHTML = ship === 0
      ? `<b>Free shipping unlocked.</b> Nothing more to add.`
      : `<b>${rupee(SHIP_FREE - sub)} to go</b> for free shipping.`;
  }

  const buyTotal = probeEl.querySelector('#buy-total');
  if (buyTotal) buyTotal.textContent = rupee(total(p));

  // Direction C writes the order out as a docket.
  const lines = probeEl.querySelector('#lines');
  if (lines){
    lines.innerHTML = `
      <li><span>${p.shortName} × ${state.qty}</span><span>${rupee(sub)}</span></li>
      <li class="muted"><span>${p.weight} each</span><span></span></li>
      <li><span>Shipping</span><span>${ship === 0 ? 'Free' : rupee(ship)}</span></li>`;
    probeEl.querySelector('#ticket-total').innerHTML =
      `${rupee(total(p))}<s>${rupee(p.originalPrice * state.qty + ship)}</s>`;
  }
}

function wireProbe(p){
  probeEl.querySelector('#close')?.addEventListener('click', close);
  probeEl.querySelectorAll('.pb-chip').forEach(chip =>
    chip.addEventListener('click', () => { state.qty = Number(chip.dataset.qty); syncBuy(p); }));
  probeEl.querySelector('#buy')?.addEventListener('click', () => openPay(p));
  probeEl.querySelector('#atc')?.addEventListener('click', () => {
    const b = probeEl.querySelector('#atc');
    b.textContent = `Added — ${state.qty} in cart`;
    setTimeout(() => { b.textContent = 'Add to cart instead'; }, 1600);
  });
  probeEl.querySelector('#upsell')?.addEventListener('click', () => openPay(SIX, true));
  syncBuy(p);
}

/* The claim, demonstrated: one tap from the hover to a payment sheet. No cart
   drawer, no cart page, no checkout page in between. */
function openPay(item, isBundle){
  const qty = isBundle ? 1 : state.qty;
  const sub = isBundle ? item.price : item.price * qty;
  const ship = sub >= SHIP_FREE ? 0 : SHIP_COST;
  const name = isBundle ? item.name : `${item.shortName} × ${qty}`;

  payEl.innerHTML = `
    <div class="pb-pay-in">
      <h3 id="pay-h">Pay and it's yours</h3>
      <p>One tap. We already have the rest — this is where the site's checkout hands off.</p>
      <div class="pb-pay-row"><span>${name}</span><b>${rupee(sub)}</b></div>
      <div class="pb-pay-row"><span>Shipping</span><b>${ship === 0 ? 'Free' : rupee(ship)}</b></div>
      <button type="button" class="pb-buy" id="pay-go">Pay ${rupee(sub + ship)} · UPI</button>
      <p class="pb-pay-note">Mock sheet. In the app this is the Shiprocket / GoKwik hand-off.</p>
      <div style="text-align:center;margin-top:10px">
        <button type="button" class="pb-ghost" id="pay-close" style="border-color:rgba(7,26,22,.4);color:var(--ink)">Back</button>
      </div>
    </div>`;
  payEl.dataset.open = '';
  payEl.querySelector('#pay-close').addEventListener('click', () => delete payEl.dataset.open);
  payEl.querySelector('#pay-go').addEventListener('click', () => {
    payEl.querySelector('#pay-go').textContent = 'Paid — order placed ✓';
  });
  payEl.querySelector('#pay-go').focus({ preventScroll:true });
}

/* ===========================================================================
   TWEAKS + KEYS
   =========================================================================== */
$('#tweaks-open').addEventListener('click', () => { $('#tweaks').hidden = false; $('#tweaks-open').hidden = true; });
$('#tweaks-close').addEventListener('click', () => { $('#tweaks').hidden = true; $('#tweaks-open').hidden = false; });

$('#seg-dir').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.dir = b.dataset.dir;
  $('#seg-dir').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (state.probe != null) open(state.probe); else open(state.index);
});

$('#seg-flav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.index = Number(b.dataset.flavour);
  $('#seg-flav').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  open(state.index);
});

$('#dwell').addEventListener('input', (e) => {
  state.dwell = Number(e.target.value); $('#dwell-val').textContent = state.dwell;
});
$('#fuse').addEventListener('change', (e) => { state.fuse = e.target.checked; });
$('#nomotion').addEventListener('change', (e) => {
  document.body.toggleAttribute('data-nomotion', e.target.checked);
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (payEl.dataset.open !== undefined) delete payEl.dataset.open;
  else if (state.probe != null) close();
});

/* ===========================================================================
   GO
   =========================================================================== */
buildCards();
$('#seg-dir').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === state.dir)));
$('#seg-flav').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.flavour) === state.index)));
paint(PRODUCTS[state.index]);
open(state.index);   // open on load so the mock shows the thing being judged
</script>
