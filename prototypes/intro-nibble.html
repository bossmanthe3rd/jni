<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Nibble &mdash; intro prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fbf6d0;
  font-family:'Inter',system-ui,sans-serif}

/* the real page, present under the overlay the whole time */
#site{position:fixed;inset:0;background:#fbf6d0}
#site header{height:86px;border-bottom:4px solid #071a16;display:flex;
  align-items:center;gap:18px;padding:0 34px}
#site .hlogo{height:50px}
#site .hlogo svg{height:100%;width:auto;fill:#231f20;display:block}
#site nav{margin-left:auto;display:flex;gap:26px;font-weight:700;color:#071a16}
#site .hero{padding:52px 34px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
#site .blk{border:4px solid #071a16;border-radius:22px;box-shadow:6px 6px 0 #071a16}
#site .b1{height:270px;background:#4db8ae}
#site .b2{height:270px;background:#f3c63b}

/* overlay */
#shake{position:fixed;inset:0;z-index:10;will-change:transform}
#stage{position:absolute;inset:0;background:#fbf6d0;overflow:hidden}
#flip{position:absolute;left:60.60%;top:39.17%;width:300vmax;height:300vmax;
  margin:-150vmax 0 0 -150vmax;border-radius:50%;background:#0b5c2e;transform:scale(0)}
#burst{position:absolute;left:60.60%;top:39.17%;width:0;height:0}
.dood{position:absolute;transform:translate(-50%,-50%);opacity:0}
.dood svg{width:100%;height:auto;display:block}

#logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(56vw,600px);aspect-ratio:2014 / 1533}
.copy{position:absolute;inset:0}
#dark{fill:#231f20}
/* the cream copy is revealed by a circle growing out of the bite, so the ink
   inverts along the same wavefront as the background */
#cream{fill:#fbf6d0;clip-path:circle(0% at 60.60% 39.17%)}
.lyr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.copy path{fill:inherit}
.word{position:absolute;inset:0}
[data-p="just"]{transform-origin:50.72% 33.53%}
[data-p="nibble"]{transform-origin:50.00% 70.58%}
[data-p="it"]{transform-origin:50.52% 100.00%}
[data-p="bBitten"],[data-p="crumbs"],[data-p="bite"]{opacity:0}

#skip{position:fixed;z-index:20;right:22px;bottom:20px;border:3px solid #071a16;
  background:#fbf6d0;color:#071a16;font:800 13px/1 'Inter',system-ui;
  letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border-radius:999px;
  box-shadow:3px 3px 0 #071a16;cursor:pointer}
@media (prefers-reduced-motion:reduce){#shake{display:none}}
</style></head>

<script>const BX=60.60, BY=39.17;

const T = {
  dur: 380, just: 20, nibble: 170, it: 320,
  chomp: 1020, shake: 280, biteFly: 480, crumbs: 840, flip: 380,
  doodle: 780, unflip: 1870, unflipDur: 340, exit: 1990, exitDur: 470,
}
const A = []
const q = (s) => [...document.querySelectorAll(s)]
const add = (els, kf, opt) => [els].flat().forEach(
  (el) => el && A.push(el.animate(kf, {fill: 'both', ...opt})))
const fwd = (els, kf, opt) => add(els, kf, {...opt, fill: 'forwards'})

/* --- the three words drop in with squash-and-stretch --------------------- */
const drop = [
  {transform:'translateY(-70vh) scaleX(0.92) scaleY(1.16)', opacity:1, offset:0,
   easing:'cubic-bezier(.42,0,.9,.4)'},
  {transform:'translateY(-2%) scaleX(0.98) scaleY(1.05)', opacity:1, offset:.58,
   easing:'cubic-bezier(.2,.7,.35,1)'},
  {transform:'translateY(0%) scaleX(1.09) scaleY(0.82)', opacity:1, offset:.74,
   easing:'cubic-bezier(.3,0,.4,1)'},
  {transform:'translateY(0%) scaleX(0.98) scaleY(1.05)', opacity:1, offset:.88,
   easing:'ease-out'},
  {transform:'translateY(0%) scaleX(1) scaleY(1)', opacity:1, offset:1},
]
add(q('[data-p="just"]'),   drop, {duration:T.dur, delay:T.just})
add(q('[data-p="nibble"]'), drop, {duration:T.dur, delay:T.nibble})
add(q('[data-p="it"]'),     drop, {duration:T.dur, delay:T.it})

/* --- the chomp ----------------------------------------------------------- */
/* the whole B swaps for the bitten one on the frame of impact */
add(q('[data-p="bWhole"]'),  [{opacity:1},{opacity:0}],
    {duration:30, delay:T.chomp, easing:'steps(1,end)'})
add(q('[data-p="bBitten"]'), [{opacity:0},{opacity:1}],
    {duration:30, delay:T.chomp, easing:'steps(1,end)'})

/* the chunk that came out tumbles away up-right and is gone */
add(q('[data-p="bite"]'), [
  {opacity:0, transform:'translate(0,0) rotate(0deg) scale(1)', offset:0},
  {opacity:1, transform:'translate(3%,-4%) rotate(24deg) scale(1.05)', offset:.18},
  {opacity:1, transform:'translate(15%,-14%) rotate(84deg) scale(.9)', offset:.6},
  {opacity:0, transform:'translate(27%,-4%) rotate(150deg) scale(.66)', offset:1},
], {duration:T.biteFly, delay:T.chomp, easing:'cubic-bezier(.2,.6,.3,1)'})

/* crumbs burst, tumble, then settle into their real positions in the logo */
add(q('[data-p="crumbs"]'), [
  {opacity:0, transform:'translate(0,0) rotate(0deg) scale(.5)', offset:0},
  {opacity:1, transform:'translate(8%,-9%) rotate(45deg) scale(2.6)', offset:.22,
   easing:'cubic-bezier(.15,.7,.3,1)'},
  {opacity:1, transform:'translate(12%,-3%) rotate(100deg) scale(2)', offset:.5},
  {opacity:1, transform:'translate(0,0) rotate(0deg) scale(1)', offset:1,
   easing:'cubic-bezier(.3,1.6,.5,1)'},
], {duration:T.crumbs, delay:T.chomp})

/* the lockup takes the hit, and the screen crunches */
add(logo, [
  {transform:'translate(-50%,-50%) scale(1)', offset:0},
  {transform:'translate(-50%,-50%) scale(.94)', offset:.3, easing:'ease-out'},
  {transform:'translate(-50%,-50%) scale(1.04)', offset:.62, easing:'ease-in-out'},
  {transform:'translate(-50%,-50%) scale(1)', offset:1},
], {duration:430, delay:T.chomp})
add(shake, [
  {transform:'translate(0,0)'}, {transform:'translate(-1.2%,1.6%)'},
  {transform:'translate(1%,-1.2%)'}, {transform:'translate(-.5%,.7%)'},
  {transform:'translate(.3%,-.3%)'}, {transform:'translate(0,0)'},
], {duration:T.shake, delay:T.chomp, easing:'ease-out'})

/* ground flips to jalapeno green out of the bite, ink inverts just behind it */
add(flip, [{transform:'scale(0)'},{transform:'scale(1)'}],
    {duration:T.flip, delay:T.chomp, easing:'cubic-bezier(.3,.75,.25,1)'})
add(cream, [
  {clipPath:`circle(0% at ${BX}% ${BY}%)`},
  {clipPath:`circle(135% at ${BX}% ${BY}%)`},
], {duration:T.flip + 60, delay:T.chomp + 40, easing:'cubic-bezier(.3,.75,.25,1)'})

/* doodles burst out from behind the logo */
q('.dood').forEach((el, i) => {
  const a = +el.dataset.a * Math.PI/180, d = +el.dataset.d, s = +el.dataset.s
  const x = Math.cos(a)*d, y = Math.sin(a)*d
  const at = (f) => `translate(calc(-50% + ${x*f}vw), calc(-50% + ${y*f}vw))`
  add(el, [
    {opacity:0, transform:`translate(-50%,-50%) rotate(0deg) scale(.15)`, offset:0},
    {opacity:1, transform:`${at(.4)} rotate(${s*.35}deg) scale(1.1)`, offset:.3,
     easing:'cubic-bezier(.1,.75,.3,1)'},
    {opacity:.95, transform:`${at(.84)} rotate(${s*.8}deg) scale(.95)`, offset:.72},
    {opacity:0, transform:`${at(1)} rotate(${s}deg) scale(.8)`, offset:1},
  ], {duration:T.doodle, delay:T.chomp + 20 + i*10})
})

/* --- hand off to the site ------------------------------------------------ */
/* measure the header logo, so the lockup lands on it at any viewport size */
const target = document.querySelector('#site .hlogo svg').getBoundingClientRect()
const here = logo.getBoundingClientRect()
const k = target.height / here.height
const tx = -50 + ((target.left + target.width/2) - (here.left + here.width/2)) / here.width * 100
const ty = -50 + ((target.top + target.height/2) - (here.top + here.height/2)) / here.height * 100

fwd(logo, [
  {transform:'translate(-50%,-50%) scale(1)', offset:0},
  {transform:'translate(-50%,-50%) scale(1.05)', offset:.16,
   easing:'cubic-bezier(.4,0,.7,.2)'},
  {transform:`translate(${tx}%, ${ty}%) scale(${k})`, offset:1},
], {duration:T.exitDur, delay:T.exit, easing:'cubic-bezier(.55,0,.28,1)'})
/* The flip runs backwards: green contracts to the bite and the ink returns to
   dark along the same wavefront. Reversing the reveal keeps every frame at full
   contrast -- cross-fading the two instead lands on muddy greys in between. */
const backEase = 'cubic-bezier(.45,0,.55,1)'
fwd(flip, [{transform:'scale(1)'},{transform:'scale(0)'}],
    {duration:T.unflipDur, delay:T.unflip, easing:backEase})
fwd(cream, [
  {clipPath:`circle(135% at ${BX}% ${BY}%)`},
  {clipPath:`circle(0% at ${BX}% ${BY}%)`},
], {duration:T.unflipDur - 30, delay:T.unflip, easing:backEase})
/* the lockup now sits exactly on the header logo, so dropping the overlay is
   invisible */
fwd(shake, [{opacity:1},{opacity:0}],
    {duration:20, delay:T.exit + T.exitDur, easing:'steps(1,end)'})

/* --- deterministic seek for frame capture -------------------------------- */
const sp = new URLSearchParams(location.search)
if (sp.has('t')) {
  const t = +sp.get('t')
  A.forEach(a => { a.pause(); a.currentTime = t })
  skip.style.display = 'none'
} else {
  const finish = () => A.forEach(a => a.finish())
  skip.onclick = finish
  shake.onclick = finish
  addEventListener('keydown', finish, {once:true})
}
window.__total = T.exit + T.exitDur
</script>
</body></html>
