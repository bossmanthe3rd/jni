<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/demo_LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Just Nibble It - bold baked FMCG snacks, real ingredients, zero guilt, maximum crunch." />
    <meta name="theme-color" content="#0D2818" />
    <title>Just Nibble It - Bold Baked Snacks</title>

    <!-- LCP is the first hero slide, which is the SWEET CHILLI background.
         This used to preload hero-bg-peri.jpg -- slide two, which is not on
         screen at first paint -- so the real LCP image was discovered late and
         a second, unused image competed with it for bandwidth. -->
    <link rel="preload" as="image" href="/assets/hero/hero-bg-sweet.jpg" fetchpriority="high" />

    <!-- Both brand faces are self-hosted (see @font-face in src/index.css), so
         the render-blocking Google Fonts stylesheet is gone: it was fetching
         Fredoka, Lilita One and Inter, none of which the page reaches any more
         once Milkyway and ComicSansMS3 load. Preloading the two woff2 files
         instead means headings and body text paint in the brand faces on the
         first frame rather than swapping in after a round trip. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/milkyway.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/comic-sans-ms3.woff2" crossorigin />

    <!--
      NOTE (clone): the live site loads Meta Pixel (id 2022133325079975), GA4 (G-VN0WE6J114),
      Wigzo, Firebase and the Shiprocket/GoKwik checkout widget here. They are intentionally
      omitted so local development does not fire events into the real brand's analytics.
      See reference/CLONE-NOTES.md.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
